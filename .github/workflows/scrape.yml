name: Update Room Status

on:
  schedule:
    # Runs at shift transitions (UTC-3 / Brasília):
    # 06:45 BRT -> 09:45 UTC (before morning shift 07:30)
    - cron: '45 9 * * 1-6'
    # 12:45 BRT -> 15:45 UTC (before afternoon shift 13:30)
    - cron: '45 15 * * 1-6'
    # 18:30 BRT -> 21:30 UTC (before night shift 19:00)
    - cron: '30 21 * * 1-6'
  workflow_dispatch:

jobs:
  update-status:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .

      - name: Generate room availability status
        run: |
          python -m salavazia.generator --rooms data/rooms.json --output data/status.json

      - name: Commit and push updated status
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/status.json
          git diff --staged --quiet || git commit -m "chore(data): auto-update room availability status [skip ci]"
          git push
