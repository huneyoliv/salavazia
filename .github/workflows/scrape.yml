name: Update Room Status

on:
  schedule:
    # Runs every 2 hours (UTC-3 / Brasília):
    - cron: '23 */2 * * 1-6'
  workflow_dispatch:

jobs:
  update-status:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .

      - name: Generate room availability status
        run: |
          python -m salavazia.generator --rooms data/rooms.json --output data/status.json
          mkdir -p web/data
          cp data/status.json web/data/status.json

      - name: Commit and push updated status
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/status.json web/data/status.json
          git diff --staged --quiet || git commit -m "chore(data): auto-update room availability status"
          git push
